name: Kotlin Windows desktop

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Test Kotlin modules and package Compose Desktop with Windows Rust ABI
        working-directory: kotlin
        shell: pwsh
        run: >-
          .\gradlew.bat
          :core:rust:jvmTest
          :core:settings:jvmTest
          :ui:app:jvmTest
          :desktopApp:test
          :desktopApp:createDistributable
      - uses: actions/upload-artifact@v4
        with:
          name: kaede-gallery-kotlin-windows-x64
          path: kotlin/desktopApp/build/compose/binaries/main/app/desktopApp
          if-no-files-found: error
