name: Kotlin Windows desktop

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: windows-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            java_distribution: temurin
            runner: windows-latest
          - arch: arm64
            java_distribution: microsoft
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.java_distribution }}
          java-version: "25"
          cache: gradle
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Build uniffi runtime for Windows ARM64
        if: matrix.arch == 'arm64'
        shell: bash
        run: tools/build-uniffi-runtime-windows-arm64.sh
      - name: Test Kotlin modules and package Compose Desktop with Windows Rust ABI
        working-directory: kotlin
        shell: pwsh
        run: >-
          .\gradlew.bat
          :core:rust:jvmTest
          :core:settings:jvmTest
          :ui:app:jvmTest
          :desktopApp:test
          :desktopApp:createDistributable
      - name: Show native test failures
        if: failure()
        working-directory: kotlin/core/rust/build
        shell: bash
        run: |
          grep -h -A6 "UnsatisfiedLinkError" test-results/jvmTest/*.xml | head -40 || true
          find . -name "*.dll" | head
      - name: Prepare Windows distribution
        shell: pwsh
        run: |
          $bundle = 'kotlin/desktopApp/build/compose/binaries/main/app/desktopApp'
          ./tools/prepare-windows-distribution.ps1 -Bundle $bundle
          ./tools/prepare-windows-media.ps1 -Bundle $bundle -Arch '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        with:
          name: kaede-gallery-kotlin-windows-${{ matrix.arch }}
          path: kotlin/desktopApp/build/compose/binaries/main/app/desktopApp
          if-no-files-found: error
