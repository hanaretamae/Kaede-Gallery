name: Windows KMP build and release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach to (for example 2.0.0b1 or 2.0.0rc1; no v prefix). Empty builds the selected ref only."
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: windows-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            java_distribution: temurin
            runner: windows-latest
          - arch: arm64
            java_distribution: microsoft
            runner: windows-11-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.java_distribution }}
          java-version: "25"
          cache: gradle

      - uses: dtolnay/rust-toolchain@1.98.1

      - name: Build uniffi runtime for Windows ARM64
        if: matrix.arch == 'arm64'
        shell: bash
        run: tools/build-uniffi-runtime-windows-arm64.sh

      - name: Verify release version
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -ne $env:TAG) {
            throw "Release tag must match VERSION $version without a v prefix"
          }

      - name: Test and package Compose Desktop
        working-directory: kotlin
        shell: pwsh
        run: >-
          .\gradlew.bat
          :core:rust:jvmTest
          :core:settings:jvmTest
          :ui:app:jvmTest
          :desktopApp:test
          :desktopApp:createDistributable
          --no-configuration-cache

      - name: Assemble Windows release archive
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $distributionRoot = 'kotlin/desktopApp/build/compose/binaries/main/app'
          $launchers = @(Get-ChildItem -LiteralPath $distributionRoot -Filter '*.exe' -File -Recurse)
          if ($launchers.Count -ne 1) {
            Get-ChildItem -LiteralPath $distributionRoot -Recurse | Select-Object -ExpandProperty FullName
            throw "Expected one Compose Desktop launcher in the Windows distribution; found $($launchers.Count)"
          }
          $bundle = $launchers[0].Directory.FullName
          ./tools/prepare-windows-distribution.ps1 -Bundle $bundle
          ./tools/prepare-windows-media.ps1 -Bundle $bundle -Arch '${{ matrix.arch }}'
          $zip = "kaede-gallery-$version-windows-${{ matrix.arch }}.zip"
          Compress-Archive -Path (Join-Path $bundle '*') -DestinationPath $zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            foreach ($name in 'Kaede-Gallery.exe', 'LICENSE', 'README.md', 'README.ja.md',
                              'THIRD_PARTY_NOTICES.md', 'THIRD_PARTY_NOTICES.ja.md') {
              if (-not ($archive.Entries | Where-Object { $_.FullName -eq $name })) {
                throw "$name must be in the Windows ZIP root."
              }
            }
          } finally {
            $archive.Dispose()
          }
          "ZIP_NAME=$zip" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: kaede-gallery-kmp-windows-${{ matrix.arch }}
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attach to release
    needs: build
    if: inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ $TAG =~ ^[0-9]+\.[0-9]+\.[0-9]+(b[0-9]+|rc[0-9]+)?$ ]] || { echo "invalid tag" >&2; exit 1; }
          gh release view "$TAG" --repo "$REPO" >/dev/null ||
            { echo "Create the release first (tools/release.sh)." >&2; exit 1; }
          cd dist
          ls -1 -- *.zip
          gh release download "$TAG" --repo "$REPO" --pattern SHA256SUMS --clobber || : > SHA256SUMS
          grep -v -E -- '-windows-(x64|arm64)\.zip$' SHA256SUMS > SHA256SUMS.new || :
          sha256sum -- *.zip >> SHA256SUMS.new
          mv SHA256SUMS.new SHA256SUMS
          gh release upload "$TAG" --repo "$REPO" --clobber -- *.zip SHA256SUMS
