name: Windows KMP build and release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach to (for example 2.0.0b1; no v prefix). Empty builds the selected ref only."
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: windows-x64
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: dtolnay/rust-toolchain@1.98.1

      - name: Verify release version
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -ne $env:TAG) {
            throw "Release tag must match VERSION $version without a v prefix"
          }

      - name: Test and package Compose Desktop
        working-directory: kotlin
        shell: pwsh
        run: >-
          .\gradlew.bat
          :core:rust:jvmTest
          :core:settings:jvmTest
          :ui:app:jvmTest
          :desktopApp:test
          :desktopApp:createDistributable

      - name: Assemble Windows release archive
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $bundle = 'kotlin/desktopApp/build/compose/binaries/main/app/desktopApp'
          if (-not (Test-Path (Join-Path $bundle 'bin/desktopApp.exe'))) {
            throw 'Compose Desktop executable is missing from the Windows distribution'
          }
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md $bundle
          Copy-Item -Recurse kotlin/shared-assets/licenses (Join-Path $bundle 'licenses')
          foreach ($name in 'Apache-2.0.txt', 'LGPL-2.1.txt', 'GPL-3.0.txt', 'RUST-DEPENDENCY-LICENSES.txt') {
            if (-not (Test-Path (Join-Path $bundle "licenses/$name"))) {
              throw "License notice $name is missing from the Windows package"
            }
          }
          $zip = "kaede-gallery-$version-windows-x64.zip"
          Compress-Archive -Path "$bundle/*" -DestinationPath $zip
          "ZIP_NAME=$zip" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: kaede-gallery-kmp-windows-x64
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attach to release
    needs: build
    if: inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ $TAG =~ ^[0-9]+\.[0-9]+\.[0-9]+(b[0-9]+)?$ ]] || { echo "invalid tag" >&2; exit 1; }
          gh release view "$TAG" --repo "$REPO" >/dev/null ||
            { echo "Create the release first (tools/release.sh)." >&2; exit 1; }
          cd dist
          ls -1 -- *.zip
          gh release download "$TAG" --repo "$REPO" --pattern SHA256SUMS --clobber || : > SHA256SUMS
          grep -v -E -- '-windows-(x64|arm64)\.zip$' SHA256SUMS > SHA256SUMS.new || :
          sha256sum -- *.zip >> SHA256SUMS.new
          mv SHA256SUMS.new SHA256SUMS
          gh release upload "$TAG" --repo "$REPO" --clobber -- *.zip SHA256SUMS
