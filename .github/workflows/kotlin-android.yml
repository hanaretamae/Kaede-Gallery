name: Kotlin Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned Android SDK and NDK
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0" "ndk;28.2.13676358"
      - name: Build and test KMP Android app
        working-directory: kotlin
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          ndk_bin="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for triple in aarch64 x86_64; do
            upper=${triple^^}
            export "CC_${triple}_linux_android=$ndk_bin/${triple}-linux-android23-clang"
            export "CXX_${triple}_linux_android=$ndk_bin/${triple}-linux-android23-clang++"
            export "AR_${triple}_linux_android=$ndk_bin/llvm-ar"
            export "RANLIB_${triple}_linux_android=$ndk_bin/llvm-ranlib"
            export "CARGO_TARGET_${upper}_LINUX_ANDROID_LINKER=$ndk_bin/${triple}-linux-android23-clang"
          done
          ./gradlew --no-daemon \
            :core:rust:jvmTest \
            :core:settings:jvmTest \
            :ui:app:jvmTest \
            :androidApp:assembleDebug
          apk=androidApp/build/outputs/apk/debug/androidApp-debug.apk
          test -f "$apk"
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$apk" | grep -F "package: name='com.hanaretamae.kaede.kmpdebug'"
          permissions=$(apkanalyzer manifest permissions "$apk")
          if grep -Eq '^android\.permission\.(INTERNET|ACCESS_NETWORK_STATE|ACCESS_WIFI_STATE|CHANGE_NETWORK_STATE|CHANGE_WIFI_STATE|MANAGE_EXTERNAL_STORAGE|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|READ_MEDIA_IMAGES|READ_MEDIA_VIDEO|READ_MEDIA_AUDIO|READ_MEDIA_VISUAL_USER_SELECTED)$' <<< "$permissions"; then
            echo "APK requests a network or broad-storage permission" >&2
            exit 1
          fi
          unzip -l "$apk" | grep -F 'lib/arm64-v8a/'
          unzip -l "$apk" | grep -F 'lib/x86_64/'
